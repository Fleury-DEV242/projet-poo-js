<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Panier d'Achat - E-commerce simplifié</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="wrapper">
      <header>
        <h2>Zandoo <span>Kitoko</span></h2>
      </header>

      <div id="container">
        <section id="cote-gauche">
          <h3>Nos produits</h3>
          <div id="produits"></div>
        </section>

        <section id="cote-droit">
          <h3>Panier</h3>
          <div id="produits-panier"></div>

          <div id="statistique">
            <div id="nombres-produits">
              <h4>Produits total</h4>
              <p id="nombre">2</p>
            </div>
            <div id="montant-produits">
              <h4>Montant total</h4>
              <p id="montant">1000 FCFA</p>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script src="app.js "></script>
  </body>
</html>
